name: Build Android AAB (Release)

on:
  push:
    branches:
      - rework

jobs:
  build:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-22.04

    steps:
      # ---------- Checkout ----------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Python ----------
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # ---------- Java ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------- Linux dependencies ----------
      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            zip unzip git libffi-dev libssl-dev libsqlite3-dev \
            zlib1g-dev libncurses5 libtinfo5 build-essential \
            uuid-dev liblzma-dev libltdl-dev

      # ---------- Python tooling ----------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Pinning Cython is crucial for Kivy compatibility
          pip install buildozer==1.5.0 "cython<3.0" sh

      # ---------- Prepare Keystore ----------
      # This step decodes the secret base64 string back into a file
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      # ---------- Build ----------
      - name: Build AAB
        env:
          # Pass secrets to Buildozer via environment variables
          P4A_RELEASE_KEYSTORE: release.keystore
          P4A_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # The 'release' command uses the environment variables above to sign the app
          buildozer android release

      # ---------- Upload ----------
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: DominoScorebook-AAB
          path: bin/*.aab
